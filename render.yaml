# Optional: deploy to Render.com (https://render.com)
# Netlify does NOT support Django — use Render, Railway, or Fly.io instead.

services:
  - type: web
    name: sportsphysio
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sportsphysio-db
          property: connectionString
      - key: CALENDLY_WEBHOOK_SIGNING_KEY
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend

databases:
  - name: sportsphysio-db
    plan: free
