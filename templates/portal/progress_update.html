{% extends "portal/base_portal.html" %}

{% block portal_content %}
<div class="portal-header">
  <h1>Update Progress — Week {{ entry.week_number }}</h1>
  <p>{{ entry.title }}</p>
</div>

<div class="form-card" style="max-width:480px;margin:0;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="form-error">{{ field.errors }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save Notes</button>
    <a href="{% url 'portal:progress' %}" class="btn" style="margin-left:0.5rem;background:var(--g50);color:var(--g800);">Cancel</a>
  </form>
</div>
{% endblock %}
