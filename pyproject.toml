[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsphysio"
version = "1.0.0"
description = "Dr. Aahana Gupta — Sports Physiotherapy practice website and patient portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "django-environ>=0.11.2",
    "whitenoise>=6.6.0",
    "Pillow>=10.0.0",
    "gunicorn>=22.0.0",
]

[project.scripts]
sportsphysio = "config.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "accounts*", "website*", "portal*", "staff*"]
